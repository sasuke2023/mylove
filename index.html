<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#211426" />
  <title>A little Diwali love</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');
    :root{--night:#211426;--plum:#301c36;--cream:#fff1d8;--gold:#f3bd58;--saffron:#f38c35;--rose:#d95069;--green:#66864a;--muted:#cebfc9;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
    *{box-sizing:border-box}html{min-height:100%;background:var(--night)}body{margin:0;min-height:100vh;color:var(--cream);font-family:var(--sans);overflow:hidden;background:radial-gradient(ellipse at 50% 115%,#613851 0,transparent 44%),radial-gradient(ellipse at 50% -20%,#452946 0,transparent 50%),linear-gradient(160deg,#25182d,#201426 64%,#28152f)}
    button{font:inherit} .stage{min-height:100svh;position:relative;display:grid;place-items:center;padding:28px 20px 90px;isolation:isolate}.stars,.stars:before,.stars:after{position:absolute;inset:0;pointer-events:none;content:"";background-image:radial-gradient(1px 1px at 12% 20%,#ffe4ac 60%,transparent),radial-gradient(1px 1px at 79% 27%,#fff0d7 60%,transparent),radial-gradient(1px 1px at 27% 64%,#ffd875 60%,transparent),radial-gradient(1px 1px at 88% 70%,#ffe7bd 60%,transparent),radial-gradient(1px 1px at 68% 11%,#ffe4ac 60%,transparent);background-size:310px 240px;opacity:.46;animation:twinkle 5s ease-in-out infinite alternate}.stars:before{transform:translate(94px,40px);opacity:.55}.stars:after{transform:translate(-85px,100px);opacity:.38}@keyframes twinkle{to{opacity:.18}}
    .glow{position:absolute;width:min(84vw,610px);height:min(75vw,520px);border-radius:50%;top:14%;background:radial-gradient(ellipse,rgba(235,163,73,.1),transparent 66%);filter:blur(12px);pointer-events:none}.content{width:min(100%,560px);position:relative;text-align:center;z-index:2;animation:arrive .72s cubic-bezier(.2,.8,.2,1) both}@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}.eyebrow{color:#e4bd86;text-transform:uppercase;letter-spacing:.22em;font-size:.65rem;font-weight:700;margin:0 0 13px}.title{font:500 clamp(2rem,7vw,3.35rem)/1.12 var(--serif);letter-spacing:-.035em;margin:0 auto 14px}.sub{font:italic 500 1.08rem/1.55 var(--serif);color:#e6cbd8;margin:0 auto 24px;max-width:390px}.small{font-size:.84rem;line-height:1.6;color:#cdbeca;max-width:350px;margin:0 auto 23px}.accent{color:#f3c15d}.cta{border:0;border-radius:999px;padding:13px 24px;background:linear-gradient(135deg,#ffc45c,#ee883a 78%);box-shadow:0 8px 24px #e7863b32,inset 0 1px 1px #fff7bd8a;color:#482a25;font-size:.9rem;font-weight:700;cursor:pointer;transition:transform .2s,filter .2s,box-shadow .2s}.cta:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 11px 30px #e7863b55}.cta:active{transform:translateY(0) scale(.98)}.cta:focus-visible,.photo-button:focus-visible,.memory-actions button:focus-visible{outline:3px solid #fff0ab;outline-offset:4px}.soft-button{border:1px solid #e6c3826b;background:#ffffff0b;color:#f4deba;border-radius:99px;padding:10px 17px;cursor:pointer;font-size:.82rem}.soft-button:hover{background:#ffffff17}.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
    .lantern-wrap{height:205px;display:grid;place-items:center;margin:0 auto 8px;position:relative}.lantern-wrap:before{content:"";position:absolute;width:220px;height:100px;bottom:7px;border-radius:50%;background:radial-gradient(ellipse,#f5bb5c32,transparent 70%);filter:blur(7px)}.lantern{width:142px;height:183px;filter:drop-shadow(0 14px 23px #f5b74f22);animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}
    .heart-wrap{height:176px;display:grid;place-items:center;margin:0 auto 10px}.heart-art{width:160px;height:150px;filter:drop-shadow(0 5px 19px #f1a23f28);animation:heartFloat 3.5s ease-in-out infinite}@keyframes heartFloat{50%{transform:translateY(-6px) rotate(1deg)}}
    .apology-heart{width:100px;height:100px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#f6ba6250 0,#e8794850 40%,#fff0 72%);font-size:3.1rem;color:#f4bc67;text-shadow:0 0 27px #f8896770;animation:heartFloat 3s ease-in-out infinite}.apology-note{max-width:450px;margin:0 auto 19px;padding:19px 22px;border:1px solid #edc67b50;border-radius:18px;background:linear-gradient(145deg,#ffffff0b,#e59b4210);box-shadow:0 15px 45px #10091340}.apology-note p{font:italic 1rem/1.7 var(--serif);color:#ead8e4;margin:0}.apology-note p+p{margin-top:12px}.apology-note strong{color:#f7ca76;font-weight:600}.apology-sign{font:600 .68rem var(--sans)!important;letter-spacing:.16em;text-transform:uppercase;color:#edbf73!important}
    .diya-scene{width:min(100%,430px);height:268px;position:relative;margin:0 auto 5px;display:grid;place-items:center}.diya{position:absolute;width:91px;cursor:pointer;transition:filter .4s,transform .3s;filter:drop-shadow(0 0 7px #d78c3280)}.diya:hover{transform:translateY(-5px) scale(1.04)}.diya.main{width:133px;left:calc(50% - 66px);top:87px}.diya.s1{left:11%;top:143px;transform:scale(.78)}.diya.s2{right:11%;top:143px;transform:scale(.78)}.diya.s3{left:20%;top:76px;transform:scale(.57);opacity:.8}.diya.s4{right:20%;top:76px;transform:scale(.57);opacity:.8}.diya .flame{transform-origin:50% 84%;animation:flicker .72s ease-in-out infinite alternate}.diya .fire{filter:drop-shadow(0 0 10px #ffb735)}@keyframes flicker{from{transform:rotate(-4deg) scale(.92,.95)}to{transform:rotate(4deg) scale(1.04,1.08)}}.diya.unlit{filter:grayscale(.82) brightness(.48);opacity:.72}.diya.unlit .flame{opacity:0}.diya-count{font-size:.75rem;color:#dbc9d7;margin:0 0 17px}
    .rangoli{position:fixed;bottom:-118px;left:50%;width:270px;height:270px;transform:translateX(-50%);opacity:.94;z-index:0;filter:drop-shadow(0 -7px 26px #f5b4451c);pointer-events:none;transition:filter .6s,opacity .6s}.rangoli svg{width:100%;height:100%}.stage[data-step="4"] .rangoli,.stage[data-step="5"] .rangoli{filter:drop-shadow(0 -12px 40px #f4be50a0);opacity:1}
    .progress{position:fixed;z-index:4;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px}.progress i{display:block;width:6px;height:6px;border-radius:50%;background:#fff3e33d;transition:all .3s}.progress i.active{width:21px;border-radius:9px;background:linear-gradient(90deg,#f1bd65,#ef8e45)}
    .music-player{position:fixed;z-index:5;top:14px;right:17px;display:flex;align-items:center;gap:10px;padding:7px 13px 7px 7px;border:1px solid #e4c07b42;border-radius:999px;background:#211426c9;backdrop-filter:blur(12px);box-shadow:0 6px 22px #10091155}.music-toggle{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:linear-gradient(135deg,#ffc45c,#ee883a);color:#482a25;font-size:.86rem;cursor:pointer}.music-toggle:hover{filter:brightness(1.1);transform:scale(1.04)}.music-copy{text-align:left;line-height:1.25}.music-copy strong{display:block;color:#f9e8d5;font-size:.7rem;font-weight:600}.music-copy span{display:block;color:#cbb8c6;font-size:.62rem;margin-top:2px}.music-status{width:36px;color:#efc86c;font-size:.59rem;font-variant-numeric:tabular-nums;text-align:right}
    .song-video{position:fixed;z-index:7;top:63px;right:17px;width:min(340px,calc(100vw - 28px));aspect-ratio:16/9;border:1px solid #e6c3826b;border-radius:13px;overflow:hidden;background:#100b13;box-shadow:0 18px 50px #08040ba6}.song-video iframe{display:block;width:100%;height:100%;border:0}
    .memory-wrap{position:relative;perspective:900px;margin:0 auto 18px;width:min(78vw,280px);height:min(92vw,360px);min-height:270px;max-height:360px}.polaroid{position:absolute;inset:0;padding:12px 12px 48px;background:#f8f1e8;border-radius:4px;box-shadow:0 25px 64px #08030c66;transform:rotate(-3deg);animation:cardIn .65s cubic-bezier(.16,.8,.25,1) both}.polaroid:nth-child(2){transform:rotate(4deg) scale(.97);z-index:-1;background:#eee1d8}@keyframes cardIn{from{opacity:0;transform:translateY(20px) rotate(-8deg) scale(.93)}to{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}}.photo-area{height:100%;width:100%;position:relative;overflow:hidden;background:linear-gradient(145deg,#a88a82,#443347 54%,#17262d);display:grid;place-items:center}.photo-area img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.photo-placeholder{font:italic 1.4rem/1.35 var(--serif);color:#fff2da;text-shadow:0 2px 14px #140b18;text-align:center;padding:20px}.photo-placeholder small{display:block;font:600 .63rem var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-top:10px;color:#fff1d8b0}.photo-caption{position:absolute;bottom:15px;left:12px;right:12px;color:#514048;font:italic 500 1rem var(--serif);text-align:center}.upload{display:inline-flex;align-items:center;gap:7px;color:#ead4df;font-size:.76rem;cursor:pointer;margin-top:14px}.upload input{display:none}.memory-meta{font:italic .98rem var(--serif);color:#e6cbd8;margin:0 0 14px}.memory-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.memory-actions button{border:0;border-radius:999px;padding:10px 17px;cursor:pointer;font-weight:700;color:#462b24;background:linear-gradient(135deg,#ffc45c,#ee883a)}.memory-actions .secondary{color:#ead9e3;border:1px solid #e6c38266;background:#ffffff0b;font-weight:500}.end-diya{width:135px;margin:0 auto 12px;filter:drop-shadow(0 0 24px #ffc75a66)}.end-diya svg{width:100%}.final-line{font:600 clamp(1.4rem,5vw,2.15rem)/1.35 var(--serif);color:#f3c15d;margin:6px auto 10px}.signature{font:600 .72rem var(--sans);letter-spacing:.13em;text-transform:uppercase;color:#e6d5db;margin:13px auto 20px}.sparkle{display:inline-block;animation:spark 1.6s ease-in-out infinite alternate}@keyframes spark{to{transform:rotate(18deg) scale(1.15)}}.burst{position:absolute;top:20%;left:14%;width:120px;height:120px;pointer-events:none;opacity:.57}.burst.right{left:auto;right:12%;top:15%;transform:scale(.7);opacity:.35}.burst path{stroke:#f4cf9c;stroke-width:1;stroke-dasharray:1 9;stroke-linecap:round;animation:burstPulse 2.5s ease-out infinite}@keyframes burstPulse{50%{opacity:.16;transform:scale(.72);transform-origin:center}}
    @media(max-width:600px){.music-player{top:auto;bottom:14px;right:13px;gap:8px;padding-right:10px}.music-copy strong{font-size:.65rem}.music-copy span{font-size:.57rem}.music-status{width:30px}.progress{top:19px;left:18px;transform:none}.stage{padding-top:64px}}
    @media(max-width:480px){.stage{padding-bottom:76px}.diya-scene{height:238px;transform:scale(.9);margin-top:-5px}.rangoli{width:235px;height:235px;bottom:-106px}.lantern-wrap{height:185px}.heart-wrap{height:158px}.burst{left:4%;top:19%;transform:scale(.72)}.burst.right{right:2%;top:15%}.small{font-size:.79rem}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="stage" id="stage" data-step="0" aria-live="polite">
  <div class="stars" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-label="Story progress"></div>
  <section class="content" id="content"></section>
  <div class="rangoli" aria-hidden="true"><svg viewBox="0 0 240 240"><defs><g id="petal"><path d="M120 12 Q137 31 120 48 Q103 31 120 12" fill="#df485d" stroke="#f4c86a" stroke-width="3"/><circle cx="120" cy="20" r="4" fill="#ffdc6f"/></g></defs><circle cx="120" cy="120" r="105" fill="#2e1936" stroke="#f5b64d" stroke-width="4"/><circle cx="120" cy="120" r="93" fill="#e74d62" stroke="#f8d476" stroke-width="4"/><circle cx="120" cy="120" r="80" fill="#f7b941" stroke="#6b833c" stroke-width="5"/><circle cx="120" cy="120" r="66" fill="#398455" stroke="#fbe090" stroke-width="4"/><circle cx="120" cy="120" r="53" fill="#f2a72e" stroke="#db4961" stroke-width="5"/><circle cx="120" cy="120" r="38" fill="#ae354e" stroke="#f8db76" stroke-width="4"/><circle cx="120" cy="120" r="25" fill="#276943" stroke="#ffce51" stroke-width="4"/><circle cx="120" cy="120" r="12" fill="#ffcf4e"/><g><use href="#petal"/><use href="#petal" transform="rotate(30 120 120)"/><use href="#petal" transform="rotate(60 120 120)"/><use href="#petal" transform="rotate(90 120 120)"/><use href="#petal" transform="rotate(120 120 120)"/><use href="#petal" transform="rotate(150 120 120)"/><use href="#petal" transform="rotate(180 120 120)"/><use href="#petal" transform="rotate(210 120 120)"/><use href="#petal" transform="rotate(240 120 120)"/><use href="#petal" transform="rotate(270 120 120)"/><use href="#petal" transform="rotate(300 120 120)"/><use href="#petal" transform="rotate(330 120 120)"/></g></svg></div>
</main>
<aside class="music-player" aria-label="Background music controls">
  <button class="music-toggle" id="musicToggle" type="button" aria-label="Play song" title="Play song">▶</button>
  <div class="music-copy"><strong>Channa Ve</strong><span>Bhoot · Part One</span></div>
  <span class="music-status" id="musicStatus">Official video</span>
</aside>
<div class="song-video" id="songVideo" hidden><iframe id="songFrame" title="Channa Ve official music video" allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<input type="file" id="photoInput" accept="image/*" hidden />
<script>
  const content = document.querySelector('#content');
  const stage = document.querySelector('#stage');
  const progress = document.querySelector('#progress');
  const photoInput = document.querySelector('#photoInput');
  const musicToggle = document.querySelector('#musicToggle');
  const musicStatus = document.querySelector('#musicStatus');
  const songVideo = document.querySelector('#songVideo');
  const songFrame = document.querySelector('#songFrame');
  let step = 0, lit = new Set([0,1,2,3,4]), memory = 0, uploaded = [];
  const memoryCaptions = ['You, glowing brighter than the diyas','A little moment, a lot of magic','A night to remember ✨','My favourite kind of forever'];
  const memoryImages = ['memory-1.jpg','memory-2.jpg','memory-3.jpg','memory-4.jpg'];
  function lantern(){return `<svg class="lantern" viewBox="0 0 160 205" role="img" aria-label="Glowing Diwali lantern"><defs><linearGradient id="metal" x2="1"><stop stop-color="#68401e"/><stop offset=".48" stop-color="#f7cb68"/><stop offset="1" stop-color="#71411d"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#b7493e"/><stop offset="1" stop-color="#e89942"/></linearGradient><radialGradient id="lg"><stop stop-color="#ffdf8c" stop-opacity=".85"/><stop offset="1" stop-color="#ffa938" stop-opacity="0"/></radialGradient></defs><ellipse cx="80" cy="120" rx="71" ry="77" fill="url(#lg)"/><path d="M80 5v14m-15 0h30m-24 0-9 12h36l-9-12" fill="none" stroke="url(#metal)" stroke-width="3"/><path d="M58 31Q80 23 102 31l9 21v74l-10 19H59l-10-19V52z" fill="url(#glass)" stroke="url(#metal)" stroke-width="5"/><path d="M61 42h38v73H61z" fill="#f6be57" opacity=".22"/><path d="M49 52h62M49 123h62M58 31h44m-43 114h43" stroke="url(#metal)" stroke-width="4"/><path d="M80 46v76m-19-62 38 45m0-45-38 45" stroke="#edc06e" stroke-width="2" opacity=".8"/><path d="M80 53l5 8-5 8-5-8zM65 83l5 7-5 7-5-7zM95 83l5 7-5 7-5-7z" fill="#ffe18a"/><path d="M73 145h14l-4 16h-6z" fill="url(#metal)"/><ellipse cx="80" cy="166" rx="35" ry="7" fill="url(#metal)"/><ellipse cx="80" cy="168" rx="48" ry="11" fill="#f8bf62" opacity=".2"/></svg>`}
  function heart(){return `<svg class="heart-art" viewBox="0 0 180 170" role="img" aria-label="A heart made of colorful rangoli patterns"><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.3" fill="#ffdb75"/><circle cx="1" cy="1" r="1.1" fill="#e24c58"/></pattern><clipPath id="hc"><path d="M90 157C76 145 18 104 18 60 18 25 61 13 90 48 119 13 162 25 162 60c0 44-58 85-72 97z"/></clipPath></defs><g clip-path="url(#hc)"><rect width="180" height="170" fill="#ac374b"/><path d="M90 8 167 84 90 162 13 84z" fill="none" stroke="#f3c14d" stroke-width="8"/><path d="M90 22 153 84 90 148 27 84z" fill="none" stroke="#f8e1a1" stroke-width="7"/><path d="M90 33 142 84 90 137 38 84z" fill="none" stroke="#408451" stroke-width="8"/><path d="M90 45 131 84 90 125 49 84z" fill="none" stroke="#f0a934" stroke-width="8"/><path d="M90 57 119 84 90 113 61 84z" fill="none" stroke="#df4b61" stroke-width="8"/><path d="M90 68 108 84 90 100 72 84z" fill="#f7d46e"/><path d="M90 76 99 84 90 93 81 84z" fill="#8b2a45"/><rect width="180" height="170" fill="url(#dots)" opacity=".55"/></g><path d="M90 157C76 145 18 104 18 60 18 25 61 13 90 48 119 13 162 25 162 60c0 44-58 85-72 97z" fill="none" stroke="#f6c663" stroke-width="4"/></svg>`}
  function burst(cls=''){return `<svg class="burst ${cls}" viewBox="0 0 100 100" aria-hidden="true">${Array.from({length:20},(_,i)=>`<path d="M50 7v${i%2?11:18}" transform="rotate(${i*18} 50 50)"/>`).join('')}</svg>`}
  function diya(id,extra=''){const off=!lit.has(id)&&id!==8;return `<svg class="diya ${extra} ${off?'unlit':''}" data-diya="${id}" viewBox="0 0 120 105" role="button" tabindex="0" aria-label="${off?'Light':'Glowing'} diya"><defs><linearGradient id="bowl${id}" x2="0" y2="1"><stop stop-color="#ffe195"/><stop offset=".42" stop-color="#eeb257"/><stop offset="1" stop-color="#9f5330"/></linearGradient><radialGradient id="halo${id}"><stop stop-color="#ffcd58" stop-opacity=".7"/><stop offset="1" stop-color="#ffb331" stop-opacity="0"/></radialGradient></defs><ellipse cx="60" cy="55" rx="58" ry="47" fill="url(#halo${id})"/><g class="flame"><path class="fire" d="M60 18C46 35 52 45 60 48c10-5 14-16 0-30z" fill="#ffcc52"/><path d="M60 27c-7 10-6 15 0 18 5-4 6-9 0-18z" fill="#fff7ce"/></g><path d="M51 51q9-9 18 0" fill="none" stroke="#71452c" stroke-width="3"/><path d="M17 56q43-11 86 0c-5 20-18 29-43 29S22 76 17 56z" fill="url(#bowl${id})" stroke="#ffdb8b" stroke-width="2"/><ellipse cx="60" cy="56" rx="43" ry="8" fill="#ffd983" stroke="#fff0bf" stroke-width="2"/><ellipse cx="60" cy="59" rx="31" ry="4" fill="#974c2d" opacity=".62"/></svg>`}
  function setStep(n){step=n;stage.dataset.step=n;render()}
  function render(){progress.innerHTML=Array.from({length:6},(_,i)=>`<i class="${i===Math.min(step,5)?'active':''}"></i>`).join('');
    if(step===0){content.innerHTML=`${burst()}${burst('right')}<div class="lantern-wrap">${lantern()}</div><p class="eyebrow">A little light for you</p><h1 class="title">Shalu,</h1><p class="sub">My love, my jaan, my everything. Before the diyas, there’s you <span class="accent">♥</span></p><button class="cta" data-next>Next <span aria-hidden="true">→</span></button>`}
    if(step===1){content.innerHTML=`<div class="heart-wrap">${heart()}</div><p class="eyebrow">For my favourite person</p><h1 class="title">Wherever you are, Shalu</h1><p class="sub">Near or far, my heart is always finding its way back to you.</p><button class="cta" data-next>Let’s light the night <span aria-hidden="true">→</span></button>`}
    if(step===2){content.innerHTML=`<p class="eyebrow">Make a little wish</p><h1 class="title">Let’s light up<br/>Diwali together</h1><div class="diya-scene">${diya(3,'s3')}${diya(4,'s4')}${diya(0,'s1')}${diya(1,'main')}${diya(2,'s2')}</div><p class="diya-count">${lit.size} of 5 diyas glowing · tap one to light it</p><div class="actions"><button class="cta" data-next>Let the memories glow <span aria-hidden="true">→</span></button></div>`}
    if(step===3){content.innerHTML=`<div class="apology-heart" aria-hidden="true">♥</div><p class="eyebrow">From my heart to yours</p><h1 class="title">I’m sorry, Shalu</h1><p class="sub">My love, my jaan, my everything.</p><div class="apology-note"><p>I’m truly sorry for the times I’ve hurt you. You deserve patience, honesty, and all the gentleness I can give.</p><p>I can’t undo what happened, but I want to listen, understand, and do better. Whenever you’re ready, I hope I can earn back your smile—one small, honest step at a time.</p><p class="apology-sign">With all my love, always</p></div><button class="cta" data-next>Our little memories <span aria-hidden="true">→</span></button>`}
    if(step===4){const src=uploaded[memory]?`<img src="${uploaded[memory]}" alt="Your added memory"/>`:`<img src="${memoryImages[memory]}" alt="Romantic wallpaper ${memory+1}"/>`;content.innerHTML=`<p class="eyebrow">A moment to keep</p><div class="memory-wrap"><div class="polaroid"><div class="photo-area">${src}</div><div class="photo-caption">${memoryCaptions[memory]}</div></div><div class="polaroid" aria-hidden="true"></div></div><p class="memory-meta">${memory===0?'A little piece of us ✨':'One for the memory book ✨'}</p><div class="memory-actions"><button data-memory-next>${memory<3?'Let it fly ✨':'One more memory ✨'}</button><button class="secondary" data-final>Skip to the wish</button></div><label class="upload">＋ Add a photo from your device<input id="uploadInline" type="file" accept="image/*" /></label>`}
    if(step===5){content.innerHTML=`<div class="end-diya">${diya(8)}</div><p class="eyebrow">My favourite light</p><h1 class="title">You are<br/>and always will be</h1><p class="final-line">my favourite light <span class="sparkle">✦</span></p><p class="signature">Every Diwali, ♥</p><button class="cta" id="wish">Happy Diwali, Shalu <span class="accent">♥</span></button><p class="small" id="wishNote" hidden style="margin-top:18px">May every little light bring us closer.<br/>I’m so lucky to have you, my love. ✨</p><div style="margin-top:18px"><button class="soft-button" data-restart>Start our little story again</button></div>`}
    content.querySelector('[data-next]')?.addEventListener('click',()=>setStep(step+1));content.querySelectorAll('[data-diya]').forEach(el=>{const act=()=>{const id=+el.dataset.diya;if(lit.has(id))lit.delete(id);else lit.add(id);render()};el.addEventListener('click',act);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}})});
    content.querySelector('[data-memory-next]')?.addEventListener('click',()=>{if(memory<3){memory++;render()}else setStep(5)});content.querySelector('[data-final]')?.addEventListener('click',()=>setStep(5));content.querySelector('[data-restart]')?.addEventListener('click',()=>{lit=new Set([0,1,2,3,4]);memory=0;setStep(0)});content.querySelector('#wish')?.addEventListener('click',e=>{document.querySelector('#wishNote').hidden=false;e.currentTarget.textContent='A wish, just for you ✨';e.currentTarget.disabled=true;for(let i=0;i<22;i++){const p=document.createElement('span');p.textContent=['✦','♥','✧','•'][i%4];p.style.cssText=`position:fixed;z-index:8;left:${42+Math.random()*16}%;top:${45+Math.random()*10}%;color:${i%2?'#f6ca69':'#f68c67'};font-size:${12+Math.random()*14}px;pointer-events:none;animation:float ${1.4+Math.random()}s ease-out both;`;document.body.append(p);setTimeout(()=>p.remove(),2600)}});
    content.querySelector('#uploadInline')?.addEventListener('change',e=>handleUpload(e.target.files?.[0]));
  }
  function handleUpload(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{uploaded[memory]=reader.result;render()};reader.readAsDataURL(file)}
  musicToggle.addEventListener('click',()=>{if(songVideo.hidden){songVideo.hidden=false;songFrame.src='https://www.youtube-nocookie.com/embed/se9DDAwwGQY?autoplay=1&playsinline=1&rel=0';musicToggle.textContent='Ⅱ';musicToggle.setAttribute('aria-label','Close song player');musicStatus.textContent='Now playing'}else{songFrame.src='';songVideo.hidden=true;musicToggle.textContent='▶';musicToggle.setAttribute('aria-label','Play Channa Ve');musicStatus.textContent='Official video'}});
  photoInput.addEventListener('change',e=>handleUpload(e.target.files?.[0]));render();
</script>
</body>
</html>
